name: Release

# Publishes release/OXP3Deck.zip as a GitHub release, in either of two ways:
# - Actions > Release > Run workflow, with the version (for example 0.1.0). The workflow creates the tag v0.1.0 on
#   the commit it runs on, with the notes in release-notes/v0.1.0.md.
# - Pushing an annotated tag such as v0.1.0. The tag's message becomes the notes.
# The version must match package.json and the version inside the committed zip (run pnpm build && pnpm zip and
# commit release/OXP3Deck.zip first). Releases are published as the latest release; tick "pre-release" (or use a
# version with a suffix such as 0.7.0-beta.1) to publish a pre-release instead. Running it again for a version that
# is already released does not upload anything: it updates that release's notes and pre-release/latest state
# (for example to promote a pre-release to the latest release).
# Before publishing it runs the Python tests, the node tests and the TypeScript check, rebuilds the zip from the
# tagged sources and stops unless the rebuilt zip holds the same files and bytes as the committed one.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (it must match package.json)"
        required: true
      prerelease:
        description: "Publish as a pre-release (not the latest release)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag name
        run: |
          printf '%s\n' "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+' || { echo "not a version tag: $TAG"; exit 1; }
      - name: Check the versions match the tag
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, sys, zipfile
          want = os.environ["TAG"].removeprefix("v")
          repo = json.load(open("package.json"))["version"]
          with zipfile.ZipFile("release/OXP3Deck.zip") as z:
              bad = z.testzip()
              inner = json.loads(z.read("OXP3Deck/package.json"))["version"]
              tool = z.read("OXP3Deck/bin/oxp3-tool")
              sums = z.read("OXP3Deck/bin/oxp3-tool.sha256").decode().split()[0]
          print(f"tag {want}, package.json {repo}, zip {inner}")
          if bad or not (want == repo == inner) or hashlib.sha256(tool).hexdigest() != sums:
              sys.exit("the zip is damaged or its version does not match the tag: rebuild and commit it")
          PY
      - uses: pnpm/action-setup@v4   # the version comes from package.json's packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: "22"   # 22.18 or later runs src/*.ts in the node tests without a flag
          cache: pnpm
      - name: Install the frontend's dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the frontend
        run: pnpm build
      - name: Python tests
        run: python -m unittest discover -s tests -t .
      - name: JS tests
        run: pnpm test:js
      - name: TypeScript check
        run: pnpm typecheck
      - name: Check the committed zip matches a fresh build
        run: |
          python3 tools/build_zip.py --skip-checks --out "$RUNNER_TEMP/rebuilt/OXP3Deck.zip"
          python3 tools/compare_zips.py release/OXP3Deck.zip "$RUNNER_TEMP/rebuilt/OXP3Deck.zip"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum OXP3Deck.zip > OXP3Deck.zip.sha256
          pre="--latest"
          case "${TAG#v}" in *-*) pre="--prerelease" ;; esac
          if [ "${{ inputs.prerelease }}" = true ]; then pre="--prerelease"; fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test -f "../release-notes/$TAG.md" || { echo "release-notes/$TAG.md is missing"; exit 1; }
            if gh release view "$TAG" >/dev/null 2>&1; then
              if [ "$pre" = --latest ]; then state="--prerelease=false --latest"; else state="--prerelease"; fi
              # shellcheck disable=SC2086
              gh release edit "$TAG" --notes-file "../release-notes/$TAG.md" --title "OXP3 Deck ${TAG#v}" $state
            else
              gh release create "$TAG" OXP3Deck.zip OXP3Deck.zip.sha256 --target "$GITHUB_SHA" \
                --notes-file "../release-notes/$TAG.md" --title "OXP3 Deck ${TAG#v}" $pre
            fi
          else
            gh release create "$TAG" OXP3Deck.zip OXP3Deck.zip.sha256 \
              --verify-tag --notes-from-tag --title "OXP3 Deck ${TAG#v}" $pre
          fi
