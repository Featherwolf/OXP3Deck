name: Release

# Publishes release/OXP3Deck.zip as a GitHub release, in either of two ways:
# - Actions > Release > Run workflow, with the version (for example 0.1.0). The workflow creates the tag v0.1.0 on
#   the commit it runs on, with the notes in release-notes/v0.1.0.md.
# - Pushing an annotated tag such as v0.1.0. The tag's message becomes the notes.
# The version must match package.json and the version inside the committed zip (run pnpm build && pnpm zip and
# commit release/OXP3Deck.zip first). Versions below 1.0.0 are published as pre-releases.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (it must match package.json)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag name
        run: |
          printf '%s\n' "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+' || { echo "not a version tag: $TAG"; exit 1; }
      - name: Check the versions match the tag
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, sys, zipfile
          want = os.environ["TAG"].removeprefix("v")
          repo = json.load(open("package.json"))["version"]
          with zipfile.ZipFile("release/OXP3Deck.zip") as z:
              bad = z.testzip()
              inner = json.loads(z.read("OXP3Deck/package.json"))["version"]
              tool = z.read("OXP3Deck/bin/oxp3-tool")
              sums = z.read("OXP3Deck/bin/oxp3-tool.sha256").decode().split()[0]
          print(f"tag {want}, package.json {repo}, zip {inner}")
          if bad or not (want == repo == inner) or hashlib.sha256(tool).hexdigest() != sums:
              sys.exit("the zip is damaged or its version does not match the tag: rebuild and commit it")
          PY
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum OXP3Deck.zip > OXP3Deck.zip.sha256
          pre=""
          case "${TAG#v}" in 0.*) pre="--prerelease" ;; esac
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test -f "../release-notes/$TAG.md" || { echo "release-notes/$TAG.md is missing"; exit 1; }
            gh release create "$TAG" OXP3Deck.zip OXP3Deck.zip.sha256 --target "$GITHUB_SHA" \
              --notes-file "../release-notes/$TAG.md" --title "OXP3 Deck ${TAG#v}" $pre
          else
            gh release create "$TAG" OXP3Deck.zip OXP3Deck.zip.sha256 \
              --verify-tag --notes-from-tag --title "OXP3 Deck ${TAG#v}" $pre
          fi
