name: CI

# The same checks as `pnpm check` and release.yml, on every push and pull request: the Python tests, the node
# tests, the TypeScript check and a zip build. It does not compare the build with release/OXP3Deck.zip, which is
# only rebuilt for a release; release.yml does that.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4   # the version comes from package.json's packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: "22"   # 22.18 or later runs src/*.ts in the node tests without a flag
          cache: pnpm
      - name: Install the frontend's dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the frontend
        run: pnpm build
      - name: Python tests
        run: python -m unittest discover -s tests -t .
      - name: JS tests
        run: pnpm test:js
      - name: TypeScript check
        run: pnpm typecheck
      - name: Lint
        run: |
          python -m pip install ruff
          ruff check .
      - name: Build the zip
        run: python3 tools/build_zip.py --skip-checks --out "$RUNNER_TEMP/OXP3Deck.zip"

  hw:
    # oxp3-hw (hw/): format, clippy, unit, fake-sysfs and private-bus tests, the release build's refusal of the test
    # options, the grant lint, the steamos-manager files, the package layout, systemd-analyze and dbus-daemon checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: hw
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dbus-daemon shellcheck udev
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: oxp3-hw checks
        run: ci/run.sh

  bathysphere-plugin:
    # OXP3 Deck for Bathysphere (bathysphere-plugin/): typecheck, build and the fake-host tests (vm
    # mode), against a pinned Bathysphere commit. Move the pin when the plugin needs a newer SDK.
    runs-on: ubuntu-24.04
    env:
      BATHYSPHERE_DIR: ${{ github.workspace }}/.bathysphere-checkout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Featherwolf/Bathysphere
          ref: 08850d19f6a48fac6623395cef21fec5e525ec01
          path: .bathysphere-checkout
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the Bathysphere SDK and fake host
        working-directory: .bathysphere-checkout
        run: |
          npm ci --no-audit --no-fund
          npm run build -w @bathysphere/sdk -w @bathysphere/fake-host
      - name: Typecheck, build and test the plugin
        working-directory: bathysphere-plugin
        run: |
          npm run typecheck
          npm test
